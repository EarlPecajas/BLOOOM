<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="loo.png" />
    <title>BLOOM Botanical Locator and Orchid Observation Mapping System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── Entire index page is dark so header + hero are one canvas ── */
    body.index-page {
      background: #040f04 !important;
    }

    /* ── Forest-green header distinct from the near-black hero ── */
    .index-page .top-nav {
      background: linear-gradient(135deg, #145A1E 0%, #0e3d14 100%) !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border-bottom: 1px solid rgba(255,255,255,.10) !important;
      box-shadow: 0 2px 16px rgba(0,0,0,.35) !important;
    }

    /* ── Logo white on dark ── */
    .index-page .brand-logo-image {
      filter: brightness(0) invert(1);
    }

    .index-page .bloom-text { color: #e8f8e0 !important; }
    .index-page .brand-tagline span { color: rgba(200,240,190,.65) !important; }
    .index-page .btn-ghost {
      color: rgba(255,255,255,.85) !important;
      border-color: rgba(255,255,255,.25) !important;
      background: rgba(255,255,255,.07) !important;
    }
    .index-page .btn-ghost:hover { background: rgba(255,255,255,.15) !important; }
    .index-page .btn-solid {
      background: rgba(255,255,255,.15) !important;
      border: 1.5px solid rgba(255,255,255,.4) !important;
      color: #fff !important;
      backdrop-filter: blur(6px);
    }
    .index-page .btn-solid:hover { background: rgba(255,255,255,.25) !important; }

    /* ── Animated hero background ── */
    .index-page .hero {
      position: relative;
      background:
        radial-gradient(ellipse 80% 60% at 70% 50%, rgba(30,110,40,.35) 0%, transparent 70%),
        radial-gradient(ellipse 50% 80% at 15% 80%, rgba(10,50,15,.6) 0%, transparent 60%),
        linear-gradient(160deg, #040f04 0%, #071a07 25%, #0d3010 55%, #145a1e 80%, #0a2a0c 100%);
      background-size: auto, auto, 250% 250%;
      animation: heroBgShift 16s ease infinite;
      overflow: hidden;
    }
    @keyframes heroBgShift {
      0%   { background-position: center, center, 0% 60%; }
      50%  { background-position: center, center, 100% 40%; }
      100% { background-position: center, center, 0% 60%; }
    }

    /* Subtle vignette overlay */
    .index-page .hero::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 40%, rgba(0,0,0,.45) 100%);
      pointer-events: none; z-index: 0;
    }

    /* Floating petals */
    .orchid-bg-canvas { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .orchid-petal {
      position: absolute;
      opacity: 0;
      will-change: transform, opacity;
      animation: petalDrift linear infinite;
    }
    @keyframes petalDrift {
      0%   { opacity: 0; transform: translateY(105vh) translateX(0px) rotate(0deg); }
      6%   { opacity: 1; }
      50%  { transform: translateY(50vh) translateX(var(--drift,20px)) rotate(180deg); }
      94%  { opacity: .12; }
      100% { opacity: 0; transform: translateY(-8vh) translateX(calc(var(--drift,20px) * 2)) rotate(360deg); }
    }

    /* Hero text */
    .index-page .hero-copy { position: relative; z-index: 1; }
    .index-page .hero-copy h1 {
      color: #ffffff !important;
      text-shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 24px rgba(0,0,0,.25);
      letter-spacing: -.01em;
    }
    .index-page .hero-description {
      color: rgba(220,245,215,.88) !important;
      text-shadow: 0 1px 8px rgba(0,0,0,.2);
    }
    .index-page .try-this { color: #8ee8a0 !important; letter-spacing: .12em; font-size: 1rem !important; }
    .index-page .separator-line { background: rgba(255,255,255,.2) !important; }
    .index-page .catalog-btn {
      position: relative; z-index: 1;
      background: rgba(255,255,255,.12) !important;
      border-color: rgba(255,255,255,.35) !important;
      color: #fff !important;
      backdrop-filter: blur(6px);
      transition: all .2s;
    }
    .index-page .catalog-btn:hover {
      background: rgba(255,255,255,.22) !important;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,0,0,.2);
    }
    .index-page .or-text { color: rgba(255,255,255,.5) !important; }

    /* Hero panel */
    .index-page .hero-panel { position: relative; z-index: 1; }
    .index-page .panel-content {
      background: rgba(10,30,10,.55) !important;
      backdrop-filter: blur(16px) saturate(1.2);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      border: 1px solid rgba(255,255,255,.14) !important;
      border-radius: 14px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,.3) !important;
    }
    .index-page .panel-label { color: rgba(180,235,170,.7) !important; letter-spacing: .1em; }
    .index-page .panel-title { color: #ffffff !important; text-shadow: 0 1px 8px rgba(0,0,0,.3); }
  </style>
  </head>
  <body class="signin-page index-page bg-light">
    <header class="top-nav navbar navbar-expand-lg px-3 px-md-4">
      <a href="index.html" class="brand-link" id="index-brand-link">
        <div class="brand-container">
          <div class="brand-logo">
            <img src="./loo.png" alt="Orchid logo" class="brand-logo-image" />
          </div>
          <div class="brand">
            <span class="bloom-text">BLOOM</span>
            <div class="brand-tagline">
              <span>Botanical Locator</span>
              <span>and Orchid Observation</span>
              <span>Mapping System</span>
            </div>
          </div>
        </div>
      </a>
      <div class="auth-actions d-flex align-items-center gap-2">
        <a href="signin.html" class="btn btn-ghost btn-outline-secondary">Sign In</a>
        <a href="register.html" class="btn btn-solid">Register</a>
      </div>
    </header>

    <main class="hero container-fluid py-3">
      <div class="orchid-bg-canvas" id="orchid-bg-canvas"></div>
      <section class="hero-copy">
        <h1>GET BLOOM3D!</h1>
        <p class="hero-description">Botanical Locator and Orchid Observation Mapping System 3D offers a wide catalog of orchids in Mt. Busa, Kiamba, Sarangani Province.</p>
        <div class="button-group">
          <p class="try-this">TRY US!</p>
          <div class="separator-line"></div>
          <div class="buttons-stack">
            <a href="catalog.html?split=1" class="catalog-btn catalog-view">Search</a>
            <span class="or-text">or</span>
            <a href="catalog.html?split=1" class="catalog-btn catalog-view">View Catalog</a>
          </div>
        </div>
      </section>

      <aside class="hero-panel" aria-hidden="true">
        <img class="hero-panel-image" src="./Indexpicture.avif" alt="Orchid showcase" />
        <div class="panel-content">
          <p class="panel-label">Orchid Atlas</p>
          <p class="panel-title">Map. Observe. Preserve.</p>
        </div>
      </aside>
    </main>

    <script>
      // ── Floating petal animation ──────────────────────────────────
      (function() {
        const canvas = document.getElementById('orchid-bg-canvas');
        if (!canvas) return;

        function petalSVG(color, w, h) {
          const tilt = (Math.random() * 40 - 20).toFixed(1);
          const cx = (w / 2).toFixed(1), cy = (h / 2).toFixed(1);
          const rx = (w / 2 - 1).toFixed(1), ry = (h / 2 - 1).toFixed(1);
          return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${color}" transform="rotate(${tilt},${cx},${cy})"/></svg>`;
        }

        const colors = [
          'rgba(255,255,255,0.52)',
          'rgba(210,252,210,0.48)',
          'rgba(255,228,248,0.46)',
          'rgba(232,255,232,0.46)',
          'rgba(255,248,255,0.42)',
          'rgba(185,242,185,0.42)',
        ];

        const COUNT = 20;
        for (let i = 0; i < COUNT; i++) {
          const el = document.createElement('div');
          el.className = 'orchid-petal';
          const w = Math.round(10 + Math.random() * 22);
          const h = Math.round(w * (2 + Math.random() * 1.2));
          const color = colors[Math.floor(Math.random() * colors.length)];
          el.innerHTML = petalSVG(color, w, h);
          el.style.left = (Math.random() * 100) + '%';
          el.style.bottom = '-' + h + 'px';
          el.style.setProperty('--drift', (Math.random() * 160 - 80).toFixed(0) + 'px');
          const duration = 16 + Math.random() * 22;
          const delay = -(Math.random() * duration);
          el.style.animationDuration = duration + 's';
          el.style.animationDelay = delay + 's';
          el.style.filter = `blur(${Math.random() < 0.35 ? (Math.random() * 1.2).toFixed(1) : 0}px)`;
          canvas.appendChild(el);
        }
      })();

      if (localStorage.getItem('bloomUser')) {
        const indexBrandLink = document.getElementById('index-brand-link');
        indexBrandLink.setAttribute('aria-disabled', 'true');
        indexBrandLink.style.pointerEvents = 'none';
        indexBrandLink.style.cursor = 'default';
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
