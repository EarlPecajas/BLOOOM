<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="loo.png" />
    <title>BLOOM Botanical Locator and Orchid Observation Mapping System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── Animated hero background ── */
    .index-page .hero {
      position: relative;
      background: linear-gradient(135deg, #071a07 0%, #0d3010 30%, #145a1e 60%, #1a6e26 100%);
      background-size: 300% 300%;
      animation: heroBgShift 12s ease infinite;
      overflow: hidden;
    }
    @keyframes heroBgShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating orchid petals container */
    .orchid-bg-canvas { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .orchid-petal {
      position: absolute;
      opacity: 0;
      animation: petalFloat linear infinite;
      will-change: transform, opacity;
    }
    @keyframes petalFloat {
      0%   { transform: translateY(110vh) rotate(0deg) scale(0.6);  opacity: 0; }
      8%   { opacity: 1; }
      90%  { opacity: .18; }
      100% { transform: translateY(-12vh) rotate(360deg) scale(1); opacity: 0; }
    }

    /* Hero text on dark bg */
    .index-page .hero-copy { position: relative; z-index: 1; }
    .index-page .hero-copy h1 { color: #ffffff !important; text-shadow: 0 2px 16px rgba(0,0,0,.4); }
    .index-page .hero-description { color: rgba(255,255,255,.85) !important; }
    .index-page .try-this { color: #a8e8a0 !important; }
    .index-page .separator-line { background: rgba(255,255,255,.25) !important; }
    .index-page .catalog-btn { position: relative; z-index: 1; }

    /* Hero panel on dark bg */
    .index-page .hero-panel { position: relative; z-index: 1; }
    .index-page .panel-content {
      background: rgba(255,255,255,.12) !important;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 12px;
    }
    .index-page .panel-label { color: rgba(255,255,255,.7) !important; }
    .index-page .panel-title { color: #ffffff !important; }
  </style>
  </head>
  <body class="signin-page index-page bg-light">
    <header class="top-nav navbar navbar-expand-lg px-3 px-md-4">
      <a href="index.html" class="brand-link" id="index-brand-link">
        <div class="brand-container">
          <div class="brand-logo">
            <img src="./loo.png" alt="Orchid logo" class="brand-logo-image" />
          </div>
          <div class="brand">
            <span class="bloom-text">BLOOM</span>
            <div class="brand-tagline">
              <span>Botanical Locator</span>
              <span>and Orchid Observation</span>
              <span>Mapping System</span>
            </div>
          </div>
        </div>
      </a>
      <div class="auth-actions d-flex align-items-center gap-2">
        <a href="signin.html" class="btn btn-ghost btn-outline-secondary">Sign In</a>
        <a href="register.html" class="btn btn-solid">Register</a>
      </div>
    </header>

    <main class="hero container-fluid py-3">
      <div class="orchid-bg-canvas" id="orchid-bg-canvas"></div>
      <section class="hero-copy">
        <h1>GET BLOOM3D!</h1>
        <p class="hero-description">Botanical Locator and Orchid Observation Mapping System 3D offers a wide catalog of orchids in Mt. Busa, Kiamba, Sarangani Province.</p>
        <div class="button-group">
          <p class="try-this">TRY US!</p>
          <div class="separator-line"></div>
          <div class="buttons-stack">
            <a href="catalog.html?split=1" class="catalog-btn catalog-view">Search</a>
            <span class="or-text">or</span>
            <a href="catalog.html?split=1" class="catalog-btn catalog-view">View Catalog</a>
          </div>
        </div>
      </section>

      <aside class="hero-panel" aria-hidden="true">
        <img class="hero-panel-image" src="./indexpic.png" alt="Orchid showcase" />
        <div class="panel-content">
          <p class="panel-label">Orchid Atlas</p>
          <p class="panel-title">Map. Observe. Preserve.</p>
        </div>
      </aside>
    </main>

    <script>
      // ── Floating orchid petal animation ──────────────────────────────
      (function() {
        const canvas = document.getElementById('orchid-bg-canvas');
        if (!canvas) return;

        // SVG orchid flower (5 petals + center)
        function orchidSVG(color, size) {
          return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 100 100">
            <g opacity="0.9">
              <ellipse cx="50" cy="22" rx="10" ry="24" fill="${color}" transform="rotate(0,50,50)"/>
              <ellipse cx="50" cy="22" rx="10" ry="24" fill="${color}" transform="rotate(72,50,50)"/>
              <ellipse cx="50" cy="22" rx="10" ry="24" fill="${color}" transform="rotate(144,50,50)"/>
              <ellipse cx="50" cy="22" rx="10" ry="24" fill="${color}" transform="rotate(216,50,50)"/>
              <ellipse cx="50" cy="22" rx="10" ry="24" fill="${color}" transform="rotate(288,50,50)"/>
              <circle cx="50" cy="50" r="7" fill="rgba(255,240,180,0.8)"/>
              <circle cx="50" cy="50" r="3" fill="rgba(255,200,80,0.9)"/>
            </g>
          </svg>`;
        }

        const colors = [
          'rgba(255,255,255,0.7)',
          'rgba(200,240,200,0.7)',
          'rgba(255,220,240,0.65)',
          'rgba(220,255,220,0.65)',
          'rgba(255,240,255,0.6)',
        ];

        const COUNT = 14;
        for (let i = 0; i < COUNT; i++) {
          const el = document.createElement('div');
          el.className = 'orchid-petal';
          const size = 36 + Math.random() * 60;
          const color = colors[Math.floor(Math.random() * colors.length)];
          el.innerHTML = orchidSVG(color, size);
          el.style.left = (Math.random() * 100) + '%';
          el.style.bottom = '-' + size + 'px';
          const duration = 14 + Math.random() * 20;
          const delay = -(Math.random() * duration);
          el.style.animationDuration = duration + 's';
          el.style.animationDelay = delay + 's';
          el.style.filter = `blur(${Math.random() < 0.4 ? (Math.random() * 1.5).toFixed(1) : 0}px)`;
          canvas.appendChild(el);
        }
      })();

      if (localStorage.getItem('bloomUser')) {
        const indexBrandLink = document.getElementById('index-brand-link');
        indexBrandLink.setAttribute('aria-disabled', 'true');
        indexBrandLink.style.pointerEvents = 'none';
        indexBrandLink.style.cursor = 'default';
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
